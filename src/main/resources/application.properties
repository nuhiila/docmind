spring.application.name=docmind

spring.datasource.url=jdbc:postgresql://localhost:5432/docmind
spring.datasource.username=docmind
spring.datasource.password=docmind

spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-this-must-be-at-least-32-characters-long}
jwt.expiration-ms=3600000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.storage.dir=uploads

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW