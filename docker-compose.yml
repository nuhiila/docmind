services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: docmind
      RABBITMQ_DEFAULT_PASS: docmind
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/docmind
      SPRING_DATASOURCE_USERNAME: docmind
      SPRING_DATASOURCE_PASSWORD: docmind
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: docmind
      SPRING_RABBITMQ_PASSWORD: docmind
      APP_STORAGE_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-this-must-be-at-least-32-characters-long}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
      - onnx-cache:/tmp/spring-ai-onnx-model

volumes:
  pgdata:
  uploads:
  onnx-cache: